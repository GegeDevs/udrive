services:
  udrive:
    # Build dari source lokal
    build: .
    # Atau pakai image dari GitHub Container Registry:
    # image: ghcr.io/gegedevs/udrive:latest
    container_name: udrive
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - udrive-db:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000

volumes:
  udrive-db:
